# Physical-arm data collection using clutch-based relative VR teleoperation.
# The sibling editable installs intentionally select the local feature branches.
nodes:
  - id: ui
    build: pip install git+https://github.com/enactic/dora-openarm-data-collection-ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "test_metadata.yaml"
    inputs:
      tick: dora/timer/secs/1
      button_a:
        source: vr-receiver/button_a
        queue_size: 100
      button_b:
        source: vr-receiver/button_b
        queue_size: 100
    outputs:
      - command

  - id: quittable-tick-arm
    build: pip install git+https://github.com/enactic/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/4
    outputs:
      - tick

  - id: quittable-tick-camera
    build: pip install git+https://github.com/enactic/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/33
    outputs:
      - tick

  - id: vr-receiver
    build: pip install -e ..
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006"
    inputs:
      tick: quittable-tick-arm/tick
    outputs:
      - pose_right
      - trigger_right
      - grip_right
      - pose_left
      - pose_reference
      - trigger_left
      - grip_left
      - joystick_x_left
      - joystick_y_left
      - joystick_x_right
      - joystick_y_right
      - button_a
      - button_b
      - button_x
      - button_y
      - vr_receive_times
      - status

  # No enable input is connected: collection teleoperation stays enabled across
  # episode boundaries. The first clutch uses state/command synchronization;
  # later clutches only update the controller/arm pose references.
  - id: teleop
    build: >-
      pip install -e ../../openarm_control -e ../../dora-openarm-kinematics
    path: dora-openarm-teleop
    args: "--sync-trigger left"
    inputs:
      grip_right: vr-receiver/grip_right
      grip_left: vr-receiver/grip_left
      force_state_sync: vr-receiver/button_y
      ik_status: vr-ik/status
    outputs:
      - active
      - syncstate
      - sync_mode
      - reset
      - status

  - id: arm-right
    build: pip install -e ../../openarm_driver -e ../../dora-openarm
    path: dora-openarm
    args: "--side right --no-align --start-on-startup --config ../../openarm_cell_higher_pd_gr00t.yaml"
    inputs:
      request_state: quittable-tick-arm/tick
      move_position: vr-ik/position_right
    outputs:
      - position
      - state
      - latest_command
      - status

  - id: arm-left
    build: pip install -e ../../openarm_driver -e ../../dora-openarm
    path: dora-openarm
    args: "--side left --no-align --start-on-startup --config ../../openarm_cell_higher_pd_gr00t.yaml"
    inputs:
      request_state: quittable-tick-arm/tick
      move_position: vr-ik/position_left
    outputs:
      - position
      - state
      - latest_command
      - status

  - id: vr-ik
    build: >-
      pip install -e ../../openarm_control -e ../../dora-openarm-kinematics
    path: dora-openarm-ik
    args: >-
      --tick-hz 250 --mode bimanual
      --origin-frame arm_origin --origin-frame-type site
      --target-mode relative --relative-input-timeout 0.1
      --max-iters 5 --limit-velocity --measured-state-timeout 0.1
    inputs:
      state_right: arm-right/state
      state_left: arm-left/state
      command_right: arm-right/latest_command
      command_left: arm-left/latest_command
      active: teleop/active
      syncstate: teleop/syncstate
      sync_mode: teleop/sync_mode
      reset: teleop/reset
      target_right: vr-receiver/pose_right
      target_left: vr-receiver/pose_left
    outputs:
      - position_right
      - position_left
      - status

  - id: lifter
    build: pip install git+https://github.com/enactic/dora-openarm-cell-lifter
    path: dora-openarm-cell-lifter
    inputs:
      joystick_y: vr-receiver/joystick_y_left
    outputs:
      - elevation_observation
      - elevation_action

  - id: camera-wrist-right
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/camera_wrist_right"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-wrist-left
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/camera_wrist_left"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-head-stereo
    build: pip install opencv-video-capture
    path: opencv-video-capture
    restart_policy: on-failure
    env:
      CAPTURE_PATH: "/dev/camera_head_stereo"
      ENCODING: "bgr8"
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: camera-head-stereo-splitter
    build: pip install git+https://github.com/enactic/dora-opencv-image-splitter
    path: dora-opencv-image-splitter
    env:
      SPLIT_MODE: "vertical"
      NUM_SPLITS: 2
      JPEG_QUALITY: 90
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: quittable-tick-camera/tick
      image: camera-head-stereo/image
    outputs:
      - image_0
      - image_1

  - id: camera-ceiling
    build: pip install opencv-video-capture
    path: opencv-video-capture
    env:
      CAPTURE_PATH: "/dev/camera_ceiling"
      ENCODING: "jpeg"
      IMAGE_HEIGHT: 600
      IMAGE_WIDTH: 960
      JPEG_QUALITY: 90
    inputs:
      tick: quittable-tick-camera/tick
    outputs:
      - image

  - id: recorder
    build: pip install -e ../../dora-openarm-dataset-recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "test_metadata.yaml"
      DIRECTORY: "vr_data"
      OPERATION_TYPE: "teleop"
    inputs:
      command:
        source: ui/command
        queue_size: 10
      # Record the final commands accepted by the physical drivers, rather than
      # the pre-clamp IK candidates. Repeated snapshots are filtered by recorder.
      arm_right_action: arm-right/latest_command
      arm_right_observation: arm-right/state
      arm_left_action: arm-left/latest_command
      arm_left_observation: arm-left/state
      elevation_action: lifter/elevation_action
      elevation_observation: lifter/elevation_observation
      camera_wrist_right: camera-wrist-right/image
      camera_wrist_left: camera-wrist-left/image
      camera_head_left: camera-head-stereo-splitter/image_0
      camera_head_right: camera-head-stereo-splitter/image_1
      camera_ceiling: camera-ceiling/image
